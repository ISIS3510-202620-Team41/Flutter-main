name: llamalla
description: "UI protototype built on Flutter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_sign_in: ^7.2.0
  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  sqflite: ^2.4.5
  path: ^1.9.1
  dio: 5.11.1
  dio_cache_interceptor: 4.0.7
  http_cache_file_store: 2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  fonts:
    - family: ABeeZee
      fonts:
        - asset: assets/fonts/ABeeZee-Regular.ttf
        - asset: assets/fonts/ABeeZee-Italic.ttf
          style: italic